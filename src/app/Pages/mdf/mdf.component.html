<h2>Registration Form</h2>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">

  <!-- Name -->
  <div>
    <label>Name</label>

    <input type="text" formControlName="name">

    <div *ngIf="userForm.get('name')?.touched">

      <small *ngIf="userForm.get('name')?.errors?.['required']">
        Name is required
      </small>

      <small *ngIf="userForm.get('name')?.errors?.['invalidName']">
        Name should contain only letters
      </small>

    </div>
  </div>

  <br>

  <!-- Email -->
  <div>
    <label>Email</label>

    <input type="email" formControlName="email">

    <div *ngIf="userForm.get('email')?.touched">

      <small *ngIf="userForm.get('email')?.errors?.['required']">
        Email is required
      </small>

      <small *ngIf="userForm.get('email')?.errors?.['email']">
        Enter valid email
      </small>

    </div>
  </div>

  <br>

  <!-- Password -->
  <div>
    <label>Password</label>

    <input type="password" formControlName="password">

    <div *ngIf="userForm.get('password')?.touched">

      <small *ngIf="userForm.get('password')?.errors?.['required']">
        Password is required
      </small>

      <small *ngIf="userForm.get('password')?.errors?.['minlength']">
        Password must be at least 6 characters
      </small>

    </div>
  </div>

  <br>

  <button type="submit">
    Submit
  </button>

</form>
