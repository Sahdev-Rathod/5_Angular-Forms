<div class="container">

    <h2>User Registration</h2>

    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">

        <!-- Name -->
        <div>
            <label>Name</label>

            <input type="text" name="name" [(ngModel)]="user.name" #name="ngModel" required minlength="3">

            <div *ngIf="name.invalid && name.touched">

                <small *ngIf="name.errors?.['required']">
                    Name is required
                </small>

                <small *ngIf="name.errors?.['minlength']">
                    Name must contain at least 3 characters
                </small>

            </div>
        </div>

        <br>

        <!-- Email -->
        <div>
            <label>Email</label>

            <input type="email" name="email" [(ngModel)]="user.email" #email="ngModel" required email>

            <div *ngIf="email.invalid && email.touched">

                <small *ngIf="email.errors?.['required']">
                    Email is required
                </small>

                <small *ngIf="email.errors?.['email']">
                    Enter a valid email
                </small>

            </div>
        </div>

        <br>

        <!-- Mobile -->
        <div>
            <label>Mobile</label>

            <input type="text" name="mobile" [(ngModel)]="user.mobile" #mobile="ngModel" required pattern="^[0-9]{10}$">

            <div *ngIf="mobile.invalid && mobile.touched">

                <small *ngIf="mobile.errors?.['required']">
                    Mobile number is required
                </small>

                <small *ngIf="mobile.errors?.['pattern']">
                    Mobile number must contain 10 digits
                </small>

            </div>
        </div>

        <br>

        <!-- Password -->
        <div>
            <label>Password</label>

            <input type="password" name="password" [(ngModel)]="user.password" #password="ngModel" required
                minlength="6">

            <div *ngIf="password.invalid && password.touched">

                <small *ngIf="password.errors?.['required']">
                    Password is required
                </small>

                <small *ngIf="password.errors?.['minlength']">
                    Password must be at least 6 characters
                </small>

            </div>
        </div>

        <br>

        <!-- Gender -->
        <div>
            <label>Gender</label>

            <select name="gender" [(ngModel)]="user.gender" #gender="ngModel" required>

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>

            </select>

            <div *ngIf="gender.invalid && gender.touched">

                <small>
                    Please select gender
                </small>

            </div>
        </div>

        <br>

        <!-- Submit -->
        <button type="submit" [disabled]="userForm.invalid">

            Submit

        </button>

    </form>

</div>
